name: Refresh Medium articles

on:
  schedule:
    # Daily at 07:17 UTC (quiet hour, avoids on-the-hour cron congestion)
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch articles from Medium RSS
        env:
          MEDIUM_USERNAME: dhsoni2510
        run: node scripts/fetch-articles.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/articles.json; then
            echo "No article changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/articles.json
          git commit -m "chore: refresh Medium articles"
          git push
